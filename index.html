<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PitPat Treadmill</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PitPat">
    <meta name="mobile-web-app-capable" content="yes">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'">
    <link rel="stylesheet" href="styles.css?v=20260515c">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>PitPat</h1>
            <nav class="tabs">
                <button class="tab is-active" data-tab="controls">Controls</button>
                <button class="tab" data-tab="history">History</button>
            </nav>
        </header>

        <main>
            <section id="controls-panel" class="panel is-active">
                <div class="status-row">
                    <span id="statusChip" class="chip chip-disconnected">Disconnected</span>
                    <div class="status-actions">
                        <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
                        <button id="connectBtn" class="btn btn-primary">Connect</button>
                    </div>
                </div>

                <section class="chart-card">
                    <svg id="sessionChart" viewBox="0 0 320 160" role="img" aria-label="Session speed, steps, and incline by minute"></svg>
                </section>

                <div class="stats-grid">
                    <div class="stat">
                        <div class="stat-label">Distance</div>
                        <div class="stat-value" id="distance">—</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Calories</div>
                        <div class="stat-value" id="calories">—</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Steps</div>
                        <div class="stat-value" id="steps">—</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Duration</div>
                        <div class="stat-value" id="duration">—</div>
                    </div>
                </div>

                <div class="settings">
                    <div class="setting">
                        <span class="setting-label">Units</span>
                        <div class="segmented" id="unitToggle" role="group" aria-label="Units">
                            <button class="seg is-active" data-value="kph" type="button" aria-pressed="true">KPH</button>
                            <button class="seg" data-value="mph" type="button" aria-pressed="false">MPH</button>
                        </div>
                    </div>
                    <div class="setting">
                        <span class="setting-label">Incline</span>
                        <div class="segmented" id="inclineToggle" role="group" aria-label="Incline">
                            <button class="seg is-active" data-value="0" type="button" aria-pressed="true">0%</button>
                            <button class="seg" data-value="7" type="button" aria-pressed="false">7%</button>
                        </div>
                    </div>
                </div>

                <div class="slider-card">
                    <div class="slider-row">
                        <span class="slider-label">Target speed</span>
                        <span class="slider-value"><span id="sliderValue">1.0</span><span id="sliderUnit"> kph</span></span>
                    </div>
                    <input type="range" id="speedSlider" min="1" max="6" step="0.1" value="1">
                </div>

                <div class="preset-row" id="presetRow" aria-label="Speed presets"></div>

                <div class="controls">
                    <button id="speedDownBtn" class="btn" disabled aria-label="Speed down">−</button>
                    <button id="startBtn" class="btn btn-go" disabled>Start</button>
                    <button id="stopBtn" class="btn btn-stop" disabled>Stop</button>
                    <button id="speedUpBtn" class="btn" disabled aria-label="Speed up">+</button>
                </div>
            </section>

            <section id="history-panel" class="panel">
                <div class="history-actions">
                    <button id="exportHistoryBtn" class="btn btn-ghost">Export</button>
                    <button id="importHistoryBtn" class="btn btn-ghost">Import</button>
                    <input type="file" id="importHistoryInput" accept="application/json" hidden />
                </div>
                <div class="calendar">
                    <div class="calendar-header">
                        <button class="cal-nav" id="prevMonthBtn" aria-label="Previous month">‹</button>
                        <div class="cal-month" id="calMonth">—</div>
                        <button class="cal-nav" id="nextMonthBtn" aria-label="Next month">›</button>
                    </div>
                    <div class="cal-weekdays">
                        <div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div>
                    </div>
                    <div class="cal-grid" id="calGrid"></div>
                </div>
                <div class="day-detail" id="dayDetail" hidden></div>
            </section>
        </main>
    </div>

    <div id="loadingOverlay" class="overlay" hidden>
        <div class="spinner"></div>
    </div>
    <div id="countdownOverlay" class="overlay overlay-dark" hidden>
        <span id="countdownNumber" class="countdown-number">3</span>
    </div>
    <div id="settingsModal" class="overlay" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-label="Settings">
            <h2 class="modal-title">Settings</h2>
            <p class="modal-hint">Used for calorie &amp; step estimates. Until set, the treadmill's own numbers are shown.</p>

            <label class="field-label" for="weightInput">Weight</label>
            <div class="field-row">
                <input type="number" id="weightInput" class="field-input" inputmode="decimal" min="1" step="0.1" placeholder="—">
                <div class="segmented" id="weightUnitToggle" role="group" aria-label="Weight unit">
                    <button class="seg is-active" data-value="kg" type="button" aria-pressed="true">kg</button>
                    <button class="seg" data-value="lb" type="button" aria-pressed="false">lb</button>
                </div>
            </div>

            <label class="field-label" for="heightInput">Height</label>
            <div class="field-row">
                <input type="number" id="heightInput" class="field-input" inputmode="decimal" min="1" step="0.1" placeholder="—">
                <div class="segmented" id="heightUnitToggle" role="group" aria-label="Height unit">
                    <button class="seg is-active" data-value="cm" type="button" aria-pressed="true">cm</button>
                    <button class="seg" data-value="in" type="button" aria-pressed="false">in</button>
                </div>
            </div>

            <div class="modal-actions">
                <button id="settingsCancelBtn" class="btn btn-ghost" type="button">Cancel</button>
                <button id="settingsSaveBtn" class="btn btn-primary" type="button">Save</button>
            </div>
        </div>
    </div>
    <div id="toast" class="toast" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/date-fns@4.1.0/cdn.min.js"
            integrity="sha384-N5s9V3fxQzmwvcYVU2BIsnjPgkKEv7vmWgJ402BvM1N8LMhLT5dcX4cFwxWxpWu6"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>
    <script type="module" src="treadmill.js?v=20260515c"></script>
</body>
</html>
